<!DOCTYPE html>
<html>
  <head>
    <title>Ninjago Dojo</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>

  <body>
    <a-scene>
  
    <a-assets>
        <img id="dojo" src="Edited Equirectangular Panorama.jpg">
      <a-asset-item id="jay" src="assests/Jay/model/Untitled Model.obj"></a-asset-item>
      <a-asset-item id="jayMtl" src="assests/Jay/model/Untitled Model.mtl"></a-asset-item>
      <a-asset-item id="kai" src="assests/Kai/model/Untitled Model.obj"></a-asset-item>
      <a-asset-item id="kaiMtl" src="assests/Kai/model/Untitled Model.mtl"></a-asset-item>
  </a-assets>

  <a-sky src="#dojo"></a-sky>

  <a-obj-model
  src="#jay"
  mtl="#jayMtl"
  position="1.5 -8.5 -7"
  scale="0.12 0.12 0.12">
</a-obj-model>

 <a-obj-model
  src="#kai"
  mtl="#kaiMtl"
  position="-1.5 -8.5 -7"
  scale="0.12 0.12 0.12">
</a-obj-model>

    <a-camera position="0 1.6 0"></a-camera>

  </a-scene>
  </body>
</html>
